[platformio]
libdeps_dir = lib

[env:stm32_f407_jlink]
platform = ststm32
board = black_f407ve
framework = stm32cube
monitor_speed = 115200 

; GCC 14.2.1
platform_packages =
    toolchain-gccarmnoneeabi@~1.140201.0

build_flags = 
    -std=gnu++23
	-Isrc/drivers
	-Isrc/motion
	-Isrc/gcode-parser
    -D HSE_VALUE=8000000U

; Настройки программатора J-Link
upload_protocol = jlink
debug_tool = jlink

; Передаем J-Link команду на обязательную верификацию после прошивки
upload_flags =
    -CommandFile
    ${platformio.packages_dir}/tool-jlink/PlatformIO_Verify.jlink
